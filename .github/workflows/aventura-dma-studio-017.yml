name: Aventura DMA Studio 0.17 - Windows x64
on:
  push:
    branches:
      - dma-studio-0.17-build
    paths:
      - "dma-studio/*.zip"
      - ".github/workflows/aventura-dma-studio-017.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests et compilation Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Decompresser les sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'dma-studio/AVENTURA_DMA_STUDIO_0.17_CONSTRUIRE_EXE_WINDOWS.zip'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Archive absente : $archive. Deposer le ZIP du constructeur dans dma-studio/ sur cette branche."
          }
          $target = Join-Path $env:RUNNER_TEMP 'aventura-sources'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
          $project = Join-Path $target '7 days to die dma/Loader/7DTD-Loader.csproj'
          if (-not (Test-Path -LiteralPath $project)) { throw "Projet WPF absent du ZIP." }
          "AVENTURA_ROOT=$target" >> $env:GITHUB_ENV

      - name: Corriger le nom de variable de la progression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:AVENTURA_ROOT '7 days to die dma/LiveEntityReader.PlayerStats.cs'
          $source = [System.IO.File]::ReadAllText($path)
          $pairs = @(
            @('byte[] data = ReadObject(progression, progressionStatClass, context.Domain);', 'byte[] progressionData = ReadObject(progression, progressionStatClass, context.Domain);'),
            @('BitConverter.ToUInt64(data, ownerField.Offset)', 'BitConverter.ToUInt64(progressionData, ownerField.Offset)'),
            @('BitConverter.ToInt32(data, levelField.Offset)', 'BitConverter.ToInt32(progressionData, levelField.Offset)'),
            @('BitConverter.ToInt32(data, pointsField.Offset)', 'BitConverter.ToInt32(progressionData, pointsField.Offset)')
          )
          foreach ($pair in $pairs) {
            if (-not $source.Contains($pair[0])) { throw "Recherche de correction introuvable: $($pair[0])" }
            $source = $source.Replace($pair[0], $pair[1])
          }
          [System.IO.File]::WriteAllText($path, $source)

      - name: Compatibilite certificat TLS Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:AVENTURA_ROOT '7 days to die dma/Loader'
          $cases = @(
            @{
              File = Join-Path $root 'Services/NetworkLink.cs'
              Old = 'certificate = request.CreateSelfSigned(DateTimeOffset.UtcNow.AddMinutes(-5), DateTimeOffset.UtcNow.AddDays(7));'
              New = 'using (var generated = request.CreateSelfSigned(DateTimeOffset.UtcNow.AddMinutes(-5), DateTimeOffset.UtcNow.AddDays(7))) { certificate = X509CertificateLoader.LoadPkcs12(generated.Export(X509ContentType.Pkcs12), null, X509KeyStorageFlags.UserKeySet | X509KeyStorageFlags.Exportable); }'
            },
            @{
              File = Join-Path $root 'Tests/ServiceTests.cs'
              Old = 'using var certificate = request.CreateSelfSigned(DateTimeOffset.UtcNow.AddMinutes(-1), DateTimeOffset.UtcNow.AddDays(1));'
              New = 'using var generatedCertificate = request.CreateSelfSigned(DateTimeOffset.UtcNow.AddMinutes(-1), DateTimeOffset.UtcNow.AddDays(1)); using var certificate = X509CertificateLoader.LoadPkcs12(generatedCertificate.Export(X509ContentType.Pkcs12), null, X509KeyStorageFlags.UserKeySet | X509KeyStorageFlags.Exportable);'
            }
          )
          foreach ($item in $cases) {
            $source = [System.IO.File]::ReadAllText($item.File)
            if (-not $source.Contains($item.Old)) { throw "Certificat source introuvable dans $($item.File)" }
            $source = $source.Replace($item.Old, $item.New)
            [System.IO.File]::WriteAllText($item.File, $source)
          }

      - name: Completer le simulateur de statistiques du controleur
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:AVENTURA_ROOT '7 days to die dma/Loader/Tests/Controller/Fakes.cs'
          $source = [System.IO.File]::ReadAllText($path)
          $anchor = '        public void UpdateReadOptions(LiveReadOptions _) { }'
          $method = '        public Task SendPlayerDmaStatAsync(PlayerDmaStatRequest request, CancellationToken cancellationToken = default) { cancellationToken.ThrowIfCancellationRequested(); ObjectDisposedException.ThrowIf(Disposed, this); PlayerDmaStatPolicy.Validate(request); return Task.CompletedTask; }'
          if (-not $source.Contains($anchor)) { throw 'Point de correction du simulateur absent.' }
          $source = $source.Replace($anchor, $method + [Environment]::NewLine + $anchor)
          [System.IO.File]::WriteAllText($path, $source)

      - name: Tests services
        shell: pwsh
        run: |
          dotnet run --project "$env:AVENTURA_ROOT/7 days to die dma/Loader/Tests/ServiceTests.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw "Tests services en echec." }

      - name: Tests controleur
        shell: pwsh
        run: |
          dotnet run --project "$env:AVENTURA_ROOT/7 days to die dma/Loader/Tests/Controller/ControllerTests.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw "Tests controleur en echec." }

      - name: Tests transport DMA
        shell: pwsh
        run: |
          dotnet run --project "$env:AVENTURA_ROOT/7 days to die dma/Loader/Tests/ControlBridge/ControlBridgeTests.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw "Tests transport en echec." }

      - name: Publier le loader autonome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = "$env:AVENTURA_ROOT/7 days to die dma/Loader/7DTD-Loader.csproj"
          $output = Join-Path $env:RUNNER_TEMP 'Aventura-DMA-Studio-0.17-win-x64'
          dotnet publish "$project" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$output"
          if ($LASTEXITCODE -ne 0) { throw "Compilation Windows en echec." }
          $exe = Join-Path $output '7DTD-Loader.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "7DTD-Loader.exe absent." }
          if ((Get-Item -LiteralPath $exe).Length -lt 100000) { throw "Executable anormalement petit." }
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $r = [System.IO.BinaryReader]::new($stream)
            if ($r.ReadUInt16() -ne 0x5A4D) { throw "Signature MZ incorrecte." }
            $stream.Position = 0x3C
            $offset = $r.ReadInt32()
            if ($offset -lt 64 -or $offset -gt 4096) { throw "En-tete PE absent." }
            $stream.Position = $offset
            if ($r.ReadUInt32() -ne 0x00004550) { throw "Signature PE incorrecte." }
            if ($r.ReadUInt16() -ne 0x8664) { throw "Architecture x64 non confirmee." }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          "7DTD-Loader.exe SHA256 $hash" | Set-Content -LiteralPath (Join-Path $output 'SHA256-7DTD-Loader.txt')
          "OUTPUT_PATH=$output" >> $env:GITHUB_ENV

      - name: Publier le ZIP executable
        uses: actions/upload-artifact@v4
        with:
          name: Aventura-DMA-Studio-0.17-Windows-x64
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error
          retention-days: 14
